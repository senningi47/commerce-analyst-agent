[project]
name = "commerce-agent"
version = "0.1.0"
description = "CommerceAnalyst: e-commerce analysis and controlled-operations agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.19,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28.1,<0.29",
  "langgraph>=1.2.11,<1.3",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.10,<3",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.3",
  "rank-bm25==0.2.2",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=30.17,<31",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
  "deepseek: explicitly paid, cost-capped DeepSeek probe",
  "postgres: requires the local product PostgreSQL test environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"
